<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Form Registration</title></head>
<body>
<!-- Netlify static form-detection decoy. Never linked in nav; registers the directory-listing form + all fields. -->

<form name="directory-listing" method="POST" data-netlify="true" enctype="multipart/form-data" hidden>
  <input type="hidden" name="form-name" value="directory-listing" />
  <input name="bot-field" />
  <input name="name" />
  <input name="company" />
  <input name="city" />
  <select name="state"></select>
  <input name="specialty" />
  <input name="credentials" />
  <input name="logo" type="file" />
  <input name="email" />
  <input name="phone" />
  <input name="website" />
  <input type="hidden" name="traffic_source" />
  <input type="hidden" name="landing_url" />
</form>

</body>
</html>
